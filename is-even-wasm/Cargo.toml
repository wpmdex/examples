[package]
name = "is-even-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }

# wasm-bindgen only needed when targeting wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = "s"

[lints.rust]
# Require documentation on every publicly reachable item (crate root, public
# modules, public functions). This crate exposes a public multi-language API
# (C FFI, WebAssembly, Python), so the exported surface should stay self
# describing in `cargo doc` and the generated C header. See issue for rationale.
missing_docs = "warn"

[lints.clippy]
# Flag functions that could be `const fn`, enabling compile-time evaluation
# and `const`/`static` use at call sites. See issue for rationale.
missing_const_for_fn = "warn"
# Flag public functions whose result is worth keeping as `#[must_use]`
# candidates. Every binding here is a pure, value-returning function, so
# silently discarding the result is almost always a bug. See issue for rationale.
must_use_candidate = "warn"
# Require code-like identifiers in doc comments to be wrapped in backticks so
# the rendered `cargo doc` output and the generated C header stay correct. This
# crate exposes a documented multi-language public API, so its prose should
# render cleanly everywhere. See issue for rationale.
doc_markdown = "warn"
# Flag `as` casts that may silently truncate an integer to a narrower type.
# This crate operates on integer inputs and re-exports them across C, WASM and
# Python ABIs, where width mismatches are easy to introduce; guard against
# silently lossy casts as the numeric API grows. See issue for rationale.
cast_possible_truncation = "warn"
